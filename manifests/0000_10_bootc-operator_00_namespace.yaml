apiVersion: v1
kind: Namespace
metadata:
  name: openshift-bootc-operator
  annotations:
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
    openshift.io/node-selector: ""
    workload.openshift.io/allowed: "management"
  labels:
    name: openshift-bootc-operator
    # No run-level: keep default so the namespace is managed on install/upgrade.
    openshift.io/run-level: ""
    # The node daemon runs privileged (hostPID, root). Enforce the privileged
    # pod-security level and disable label sync so it is not downgraded.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    security.openshift.io/scc.podSecurityLabelSync: "false"
